name: Update Top Contributed Project

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-top-contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution statistics
        uses: HwangTaehyun/github-contributor-stats/action@main
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: Abhikk-Ghosh
          output-file: top-contributed.svg
          combine-all-yearly-contributions: "true"
          hide-contributor-rank: "true"
          order-by: contributions
          limit: "1"
          theme: dark
          rate-limit-delay-ms: "100"

      - name: Move generated file
        run: |
          mkdir -p assets
          mv top-contributed.svg assets/top-contributed.svg

      - name: Commit updated contribution card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-contributed.svg
          git diff --cached --quiet || git commit -m "Update top contributed project"
          git push
